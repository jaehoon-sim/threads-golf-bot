# 쿠팡파트너스 상품 카탈로그
#
# 링크는 partners.coupang.com 에서 직접 만든 것만 넣는다 (상품 페이지 → 링크 생성).
# Claude 는 이 목록 밖의 상품을 절대 추천하지 않고, facts 에 없는 특징을 지어내지 않는다.
#
# 필드
#   key      상품 고유 키 (영문·하이픈). 쿨다운 판정에 쓰인다
#   name     상품명 (쿠팡 표기 그대로)
#   link     https://link.coupang.com/a/xxxxx  형태의 파트너스 단축 링크
#   pillars  이 상품을 자연스럽게 붙일 수 있는 콘텐츠 기둥 (topic_pool.yaml 의 key)
#   fits     어떤 사람·상황에 맞는지 한 줄. 글의 판단 기준으로 쓰인다
#   facts    상품 페이지에서 직접 확인한 사실. 가격·할인율은 넣지 않는다
#   active   true 인 것만 쓰인다
#
# 객단가가 높을수록 건당 수수료가 크다. 수수료율은 카테고리별로 다르고 대체로 3% 안팎이다.
# 아래는 골프 계정에서 자연스럽게 붙는 카테고리별 자리만 잡아 둔 것이다. 상품을 골라 채운다.

